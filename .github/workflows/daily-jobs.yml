name: Daily jobs

# Calls the run-daily-jobs Edge Function once a day: reminders, post-event
# report requests, to-do upkeep. See README → "Daily jobs".
on:
  schedule:
    - cron: '17 14 * * *' # 14:17 UTC ≈ 7–8 AM in Utah (GitHub may start it a few minutes late)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only report what would happen (send nothing)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call run-daily-jobs
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY_RUN: ${{ inputs.dry_run && '?dry_run=1' || '' }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the VITE_SUPABASE_URL variable and the CRON_SECRET secret (see README)."
            exit 1
          fi
          BASE="$(echo "$SUPABASE_URL" | sed -E 's#(https?://[^/]+).*#\1#')"
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST "$BASE/functions/v1/run-daily-jobs$DRY_RUN" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json"
          echo
